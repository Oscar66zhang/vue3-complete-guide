<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue3 Demo</title>
    <!-- 引入 Vue3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
  <script>
    // data & method & computed & watcher
    // computed和method都能实现的一个功能，建议使用computed
    // computed和watch 都能实现的功能，建议使用computed 因为更加简洁
    const app = Vue.createApp({
      data() {
        return {
          message: "hello world",
          count: 1,
          price: 5,
          newTotal: 10,
        };
      },
      watch: {
        //price发生变化时，函数会执行
        price(current, prev) {
          this.newTotal = current * this.count;
        },
      },
      computed: {
        //当计算属性依赖的内容发生变更时，才会重新执行计算
        total() {
          return Date.now() + this.count;
          // return this.count * this.price;
        },
      },
      methods: {
        formatString(string) {
          return string.toUpperCase();
        },
        //只要页面重新渲染，才会重新计算
        getTotal() {
          return Date.now();
        },
      },

      template: `<div>
        {{message}}
        {{newTotal}}
        </div>`,
    });
    //vm 代表的就是vue应用的根组件
    const vm = app.mount("#root");
  </script>
</html>
