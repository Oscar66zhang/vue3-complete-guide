<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue3 Demo</title>
    <!-- 引入 Vue3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="root">{{message}}</div>
  </body>
  <script>
    // MVVM = Model(数据) + View(页面) + ViewModel(连接数据和页面)
    //生命周期函数：在某一时刻会自动执行的函数
    const app = Vue.createApp({
      data() {
        return {
          message: "hello world",
        };
      },
      //在实例生成之前会自动执行的函数
      beforeCreate() {
        console.log("beforeCreate");
      },
      //在实例生成之后会自动执行的函数
      created() {
        console.log("created");
      },
      //在组件内容被渲染到页面之前立即自动执行的函数
      beforeMount() {
        console.log(document.getElementById("root").innerHTML, "beforeMount");
      },
      //在组件内容被渲染到页面之后自动执行的函数
      mounted() {
        console.log(document.getElementById("root").innerHTML, "mounted");
      },
      //当data中的数据发生变化时会立即自动执行的函数
      beforeUpdate() {
        console.log(document.getElementById("root").innerHTML, "beforeUpdate");
      },
      //当数据发生变化，页面重新渲染后，会自动更新的函数
      updated() {
        console.log(document.getElementById("root").innerHTML, "updated");
      },

      /*       methods: {
        handleItemClick() {
          alert("click");
        },
      }, */
      // 当Vue应用失效时，自动执行的函数
      beforeUnmount() {
        console.log(document.getElementById("root").innerHTML, "beforeUnmount");
      },
      //当Vue应用失效时,且dom完全销毁之后，自动执行的函数
      unmounted() {
        console.log(document.getElementById("root").innerHTML, "unmounted");
      },
    });
    //vm 代表的就是vue应用的根组件
    const vm = app.mount("#root");
  </script>
</html>
