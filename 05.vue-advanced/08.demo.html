<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Render Function</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script>
      // plugin 插件，也是把通用性的功能给封装起来
      const myPlugin = {
        install(app, options) {
          app.provide("name", "Dell Lee");
          app.directive("focus", {
            mounted(el) {
              el.focus();
            },
          });
          app.mixin({
            mounted() {
              console.log("mixin");
            },
          });
          // 给整个 Vue 应用中的所有组件实例，挂一个全局属性 $sayHell
          // 所有组件实例都能访问的“公共属性仓库
          app.config.globalProperties.$sayHello = "hello world";
        },
      };

      const app = Vue.createApp({
        template: `
          <my-title />
        `,
      });

      // 注册子组件
      app.component("my-title", {
        inject: ["name"],
        mounted() {
          console.log(this.$sayHello);
        },
        template: `<div>{{name}} <input v-focus /></div>`,
      });

      app.use(myPlugin, { name: "dell" });

      const vm = app.mount("#root");
    </script>
  </body>
</html>
