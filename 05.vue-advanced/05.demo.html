<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Advanced</title>
    <style>
      .header {
        position: absolute;
      }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script>
      // 自定义指令 directive
      /*
       const directives = {
        focus: {
          mounted(el) {
            el.focus();
          },
        },
      }; */

      const app = Vue.createApp({
        data() {
          return {
            distance: 100,
          };
        },
        // pos：一个自定义指令
        template: `
        <div>
          <div v-pos:left="distance" class="header">
             <input />
          </div>
        </div>
      `,
      });
      // binding 是一个对象，里面保存了这个指令的相关信息
      // el      → 当前使用这个指令的 DOM 元素
      // binding → 这个指令本身携带的信息
      app.directive("pos", (el, binding) => {
        el.style[binding.arg] = binding.value + "px";
      });

      // 挂载
      const vm = app.mount("#root");
    </script>
  </body>
</html>
