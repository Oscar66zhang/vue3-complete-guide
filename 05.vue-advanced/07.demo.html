<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Render Function</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script>
      // render function
      // template -> render -> h -> 虚拟DOM(JS对象) ->真实DOM ->展示到页面上
      const app = Vue.createApp({
        template: `
          <my-title :level="1">
            hello dell
          </my-title>
        `,
      });

      // 注册子组件
      app.component("my-title", {
        props: ["level"],
        render() {
          const { h } = Vue;
          // 虚拟 DOM：虚拟 DOM，就是用 JavaScript 对象来描述“页面应该长什么样
          /*
           {
            type: "h1",      对应  "h" + this.level
            props: {},       对应 {}
            children: [      对应 this.$slots.default()
              "hello dell"
            ]
          }
          */
          return h("h" + this.level, {}, [
            this.$slots.default(),
            h("h3", {}, "dell"),
          ]);
        },
      });

      const vm = app.mount("#root");
    </script>
  </body>
</html>
