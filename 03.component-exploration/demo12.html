<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Demo</title>

    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <!-- Vue 挂载节点 -->
    <div id="root"></div>

    <script>
      // v-once：让某个元素标签只渲染一次
      // ref 实际上是获取Dom节点/组件引用的的一个语法
      // provide/inject
      const app = Vue.createApp({
        data() {
          return {
            count: 1,
          };
        },
        // provide: {
        //   count: 6,
        // },
        provide() {
          return {
            count: 6,
          };
        },
        template: `
          <div>
             <child :count="count" />
             <button @click="count+=1">Add</button>
          </div>
        `,
      });

      app.component("child", {
        template: `<child-child  />`,
      });

      app.component("child-child", {
        inject: ["count"],
        template: `<div>{{count}}</div>`,
      });

      // 挂载 Vue 应用
      const vm = app.mount("#root");
    </script>
  </body>
</html>
