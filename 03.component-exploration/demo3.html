<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Demo</title>

    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <!-- Vue 挂载节点 -->
    <div id="root"></div>

    <script>
      // v-bind="params"
      // :content="params.content" :a="params.a" :b="params.b" :c="params.c"
      // 属性传的时候，使用 content-abc 这种命名，接的时候，使用 contentAbc 命名
      // 单向数据流的概念：子组件可以使用父组件传递过来的数据，但是不可以修改父组件传递过来的数据
      const app = Vue.createApp({
        data() {
          return {
            num: 1,
          };
        },

        template: `
        <div>
          <counter :count="num" />
          </div>`,
      });
      // type:String,Boolean,Array,Object,Function
      // required 必填
      // default 默认值
      app.component("counter", {
        // Vue 会自动帮你做一层 kebab-case（短横线命名）→ camelCase（驼峰命名） 的转换
        props: ["count"],
        data() {
          return {
            myCount: this.count,
          };
        },
        template: `<div @click="myCount+=1">{{myCount}}</div>`,
      });

      const vm = app.mount("#root");
    </script>
  </body>
</html>
