<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Composition API</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
      const app = Vue.createApp({
        template: `
      <div @click="handleClick">
       {{name}}
      </div>
    `,

        methods: {
          test() {
            console.log(this.$options.setup());
          },
        },

        mounted() {
          this.test();
        },
        //props：用来接收父组件传入的数据
        //context：第二个参数包含一些组件上下文能力
        //created 实例被完全初始化之前
        setup(props, context) {
          return {
            name: "dell",
            handleClick: () => {
              alert(123);
            },
          };
        },
      });

      const vm = app.mount("#root");
    </script>
  </body>
</html>
