<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Composition API</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
      // watch 侦听器
      // watchEffect 侦听器，偏向于effect
      const app = Vue.createApp({
        setup() {
          const { reactive, watch, toRefs, watchEffect } = Vue;
          const nameObj = reactive({ name: "dell", englishName: "lee" });
          // 具备一定的惰性 lazy
          // 参数可以拿到原始和当前值
          // 可以侦听多个数据的变化，用一个侦听器承载

          watch(
            [() => nameObj.name, () => nameObj.englishName],
            ([curName, curEng], [prevName, prevEng]) => {
              console.log(curName, prevName, "------", curEng, prevEng);
            },
            {
              immediate: true,
            },
          );

          // 立即执行，没有惰性，immediate
          // 不需要传递你要侦听的内容，自动感知代码依赖，不需要传递很多参数，只需要传递一个回调函数
          // watchEffect不能获取数据之前的值
          const stopWatchEffect = watchEffect(() => {
            console.log(nameObj.name);
            console.log(nameObj.englishName);
            setTimeout(() => {
              stopWatchEffect();
            }, 5000);
          });

          const { name, englishName } = toRefs(nameObj);

          return { nameObj, englishName };
        },
        template: `
        <div>
          <div>
              Name:<input v-model="nameObj.name" />
          </div>

          <div>
              Name:{{nameObj.name}}
          </div>

           <div>
              EnglishName:<input v-model="englishName" />
          </div>

           <div>
              EnglishName is {{englishName}}
          </div>
        </div>
        `,
      });

      const vm = app.mount("#root");
    </script>
  </body>
</html>
