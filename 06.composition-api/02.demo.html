<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Composition API</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
      // ref，reactive响应式的引用
      // 原理，通过proxy对数据进行封装，当数据变化时，触发模板等内容的更新
      // ref处理基础类型的数据
      // reactive处理非基础类型的数据
      const app = Vue.createApp({
        template: `
      <div>
       {{nameObj.name}}
      </div>
    `,
        setup(props, context) {
          /*   const { ref } = Vue;
          // proxy,'dell' 变成 proxy({value:"dell"}) 这样一个响应式的引用
          let name = ref("dell");
          setTimeout(() => {
            name.value = "lee";
          }, 200);
          return { name }; */
          const { reactive } = Vue;
          // proxy，{ name: 'dell'} 变成 proxy({ name: 'dell'}) 这样的一个响应式引用
          const nameObj = reactive({ name: "dell" });
          setTimeout(() => {
            nameObj.name = "lee";
          }, 2000);
          return { nameObj };
        },
      });

      const vm = app.mount("#root");
    </script>
  </body>
</html>
